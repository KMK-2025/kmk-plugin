# قاعدة البيانات بأمر واحد — بديل تنصيب MySQL يدويًا على جهاز المتدرب
# التشغيل:  docker compose up -d
# الإيقاف:  docker compose down     (البيانات تبقى محفوظة)

services:
  mysql:
    image: mysql:8.0
    container_name: app-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # واجهة رسومية لقاعدة البيانات على http://localhost:8081
  # مفيدة للمدرب فقط — لا تُذكر للمتدرب إلا عند الحاجة
  adminer:
    image: adminer
    container_name: app-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  mysql-data:
