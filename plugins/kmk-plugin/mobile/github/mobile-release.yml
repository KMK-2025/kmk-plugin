name: نشر تطبيق الجوال

# يعمل عند دفع وسم مثل mobile-v1.2.0 (يدفعه الأمر /deploy mobile) أو يدويًا.
#
# متغيرات المستودع (Settings → Secrets and variables → Actions → Variables):
#   MOBILE_API_URL        عنوان الخدمات الذي يتصل به التطبيق، مثل https://api.example.com/api
#   IOS_ENABLED           true لتفعيل بناء iOS
# أسرار اختيارية للتوزيع على المختبِرين عبر Firebase App Distribution:
#   FIREBASE_ANDROID_APP_ID · FIREBASE_SERVICE_ACCOUNT · FIREBASE_TESTERS_GROUP

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: بوابة الجودة
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          dart format --set-exit-if-changed lib test
          flutter test

      - name: بناء التطبيق
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_URL="${{ vars.MOBILE_API_URL }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: توزيع على المختبِرين
        if: env.FIREBASE_ANDROID_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ secrets.FIREBASE_TESTERS_GROUP }}
          file: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS
    if: vars.IOS_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # يتحقق أن التطبيق يُبنى لـ iOS. الرفع إلى TestFlight يحتاج حساب Apple Developer
      # وشهادات التوقيع — تُضاف هنا عند توفر الحساب.
      - name: بناء iOS (بلا توقيع)
        working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=API_URL="${{ vars.MOBILE_API_URL }}"
