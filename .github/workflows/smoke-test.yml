name: smoke-test

# اختبار دخان: ينشئ مشروعًا كاملًا ثم يثبت أن **تسجيل الدخول يعمل فعلًا**،
# لا أن المجلدات موجودة. كل ما تعِد به الإضافة يُتحقَّق منه هنا قبل النشر.

on:
  pull_request:
  push:
    branches: [main]
  # أسبوعيًا: إصدار أعلى من Laravel أو npm قد يكسر الأساس بلا أي تغيير منّا،
  # والأفضل أن نكتشف ذلك نحن لا متدرّب على جهازه.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scaffold:
    name: إنشاء مشروع كامل والتحقق من أنه يعمل
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, pdo_mysql
          tools: composer:v2

      - name: تهيئة هوية Git (يحتاجها الالتزام الأول في السكربت)
        run: |
          git config --global user.name "smoke-test"
          git config --global user.email "smoke-test@ci.local"

      - name: تشغيل سكربت الإنشاء كاملًا
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          bash "$GITHUB_WORKSPACE/plugins/kmk-plugin/scripts/setup-project.sh" smokeproj root root

      # ---------- الأساس التقني موجود فعلًا ----------
      - name: التحقق من ملفات الأساس ومحتواها
        run: |
          cd "$RUNNER_TEMP/work/smokeproj"
          fail=0
          for f in \
            .claude/hooks/guard.sh .claude/settings.json CLAUDE.md \
            docs/api-contract.md docs/design-system.md \
            frontend/package-lock.json \
            frontend/src/shared/api/client.ts \
            frontend/src/shared/api/types.ts \
            frontend/src/shared/forms/applyServerErrors.ts \
            frontend/src/shared/store/auth.store.ts \
            frontend/src/shared/hooks/useListParams.ts \
            frontend/src/shared/hooks/useListQuery.ts \
            frontend/src/shared/components/feedback/StateBoundary.tsx \
            frontend/src/shared/components/feedback/Loading.tsx \
            frontend/src/app/router.tsx frontend/src/app/routes.tsx \
            frontend/src/app/RootLayout.tsx frontend/src/app/ProtectedRoute.tsx \
            frontend/src/features/auth/services/auth.service.ts \
            frontend/src/styles/theme.css frontend/src/i18n.ts \
            backend/app/Support/ApiResponse.php \
            backend/app/Modules/Auth/Http/Controllers/V1/AuthController.php \
            backend/routes/api/v1/auth.php \
            backend/database/seeders/RolePermissionSeeder.php \
            backend/bootstrap/app.php backend/phpunit.xml backend/tests/Pest.php ; do
            [ -f "$f" ] || { echo "::error::ملف ناقص: $f"; fail=1; }
          done

          grep -q 'API_VERSION' frontend/src/shared/api/client.ts || { echo "::error::ثابت النسخة مفقود"; fail=1; }
          grep -q "permission" backend/bootstrap/app.php || { echo "::error::اسم وسيط الصلاحيات غير مسجّل"; fail=1; }
          grep -q 'bootstrap.rtl.min.css' frontend/src/main.tsx || { echo "::error::bootstrap RTL غير مستورد"; fail=1; }
          grep -q 'dir="rtl"' frontend/index.html || { echo "::error::الاتجاه RTL غير مضبوط"; fail=1; }
          [ "$(cat frontend/src/locales/ar.json)" != '{}' ] || { echo "::error::ar.json فارغ"; fail=1; }

          [ "$fail" -eq 0 ] && echo "الأساس التقني كامل"
          exit "$fail"

      # ---------- ولا تصميم مفروض ----------
      - name: التحقق من عدم وجود تصميم مفروض في الأساس
        run: |
          cd "$GITHUB_WORKSPACE/plugins/kmk-plugin/starter"
          fail=0
          # هذه الأسماء تعني أن أحدًا حشا تصميمًا في الأساس — وهو ما تمنعه فلسفة الإضافة.
          if find . \( -iname '*sidebar*' -o -iname '*navbar*' -o -iname '*topbar*' -o -iname '*dashboard*' \) | grep -q .; then
            echo "::error::وُجد مكوّن تصميم في الأساس — الشكل من عمل /صمم وحده"
            fail=1
          fi
          if grep -qE '#[0-9a-fA-F]{3,8}|rgba?\(' frontend/src/styles/theme.css; then
            echo "::error::theme.css يحتوي ألوانًا — يبقى فارغًا حتى يملأه /صمم"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "لا تصميم مفروض: المعمار محدَّد والشكل حرّ"
          exit "$fail"

      # ---------- الحواجز ----------
      - name: اختبار حاجز الأمان
        run: |
          cd "$RUNNER_TEMP/work/smokeproj"
          g=.claude/hooks/guard.sh
          allow() {
            if ! printf '%s' "$1" | bash "$g" >/dev/null 2>&1; then
              echo "::error::الحاجز منع أمرًا آمنًا: $1"; exit 1
            fi
          }
          deny() {
            if printf '%s' "$1" | bash "$g" >/dev/null 2>&1; then
              echo "::error::الحاجز لم يمنع: $1"; exit 1
            fi
          }
          allow '{"tool_input":{"command":"git status"}}'
          allow '{"tool_input":{"command":"echo X >> backend/.env"}}'
          allow '{"tool_input":{"command":"git rm -r --force --quiet ."}}'
          allow '{"cwd":"/tmp/.env","tool_input":{"command":"ls -la"}}'
          deny  '{"tool_input":{"command":"cat backend/.env"}}'
          deny  '{"tool_input":{"command":"rm -rf frontend"}}'
          deny  '{"tool_input":{"command":"php artisan migrate:fresh"}}'
          echo "الحاجز يعمل"

      # ---------- بوابات الجودة ----------
      - name: بوابة الواجهة
        working-directory: ${{ runner.temp }}/work/smokeproj/frontend
        run: |
          npm run check
          npm run build

      - name: بوابة الخدمات
        working-directory: ${{ runner.temp }}/work/smokeproj/backend
        run: |
          ./vendor/bin/pint --test
          ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          php artisan test

      # ---------- الأدوار والمستخدمون مزروعون ----------
      - name: التحقق من الزرع
        working-directory: ${{ runner.temp }}/work/smokeproj/backend
        run: |
          php artisan tinker --execute="exit(\App\Models\User::where('email','admin@test.com')->exists() && \App\Models\User::where('email','staff@test.com')->exists() && \Spatie\Permission\Models\Role::where('name','admin')->exists() ? 0 : 1);"
          echo "admin و staff والأدوار موجودون"

      # ---------- العقد: الدخول يعمل والغلاف موحّد ----------
      - name: اختبار عقد الخدمات
        working-directory: ${{ runner.temp }}/work/smokeproj/backend
        run: |
          php artisan serve --port=8000 >/tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/up >/dev/null && break
            sleep 1
          done
          API=http://127.0.0.1:8000/api/v1
          JSON='Content-Type: application/json'
          ACC='Accept: application/json'

          # كلمة سر خاطئة → 422 برسالة عربية فعلًا، لا بنص Laravel الافتراضي
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$API/auth/login" \
            -H "$JSON" -H "$ACC" -d '{"email":"admin@test.com","password":"wrong"}')
          if [ "$code" != 422 ]; then echo "::error::توقّعت 422 وجاء $code"; cat /tmp/r.json; exit 1; fi
          jq -e '.success == false and .data == null and has("errors")' /tmp/r.json >/dev/null \
            || { echo "::error::غلاف الخطأ غير موحّد"; cat /tmp/r.json; exit 1; }
          jq -e '.errors.email[0] | test("[؀-ۿ]")' /tmp/r.json >/dev/null \
            || { echo "::error::رسالة التحقق ليست عربية"; cat /tmp/r.json; exit 1; }

          # كلمة سر صحيحة → 200 وتوكن
          TOKEN=$(curl -sf -X POST "$API/auth/login" -H "$JSON" -H "$ACC" \
            -d '{"email":"admin@test.com","password":"password"}' | jq -r '.data.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = null ]; then echo "::error::تسجيل الدخول فشل"; exit 1; fi

          # me → الصلاحيات موجودة وكلمة السر غير مسرّبة
          curl -sf "$API/auth/me" -H "Authorization: Bearer $TOKEN" -H "$ACC" \
            | jq -e '.success == true and .data.role == "admin" and (.data.permissions | type == "array") and (.data | has("password") | not)' >/dev/null \
            || { echo "::error::رد /auth/me لا يطابق العقد"; exit 1; }

          # بلا توكن → 401 بالغلاف الموحّد.
          # هذا الاختبار هو الذي يثبت ربط معالج الأخطاء: Laravel الافتراضي يحوّل أو يرجع HTML.
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' "$API/auth/me" -H "$ACC")
          if [ "$code" != 401 ]; then echo "::error::توقّعت 401 وجاء $code"; exit 1; fi
          jq -e '.success == false' /tmp/r.json >/dev/null \
            || { echo "::error::401 لا يستخدم الغلاف الموحّد — معالج الأخطاء غير مربوط"; exit 1; }

          # مسار غير موجود → 404 بالمفاتيح الأربعة نفسها
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' "$API/does-not-exist" -H "$ACC")
          if [ "$code" != 404 ]; then echo "::error::توقّعت 404 وجاء $code"; exit 1; fi
          jq -e 'has("success") and has("data") and has("message") and has("errors")' /tmp/r.json >/dev/null \
            || { echo "::error::404 لا يستخدم الغلاف الموحّد"; exit 1; }

          echo "العقد مطابق: الدخول يعمل والغلاف موحّد في كل الحالات"

  idempotent:
    name: إعادة التشغيل تُكمل ولا تبدأ من جديد
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, pdo_mysql
          tools: composer:v2
      - run: |
          git config --global user.name ci
          git config --global user.email ci@ci.local

      # الاستئناف موعود به في /ابدأ ولم يُختبر قبل اليوم.
      - name: تشغيل السكربت مرتين على نفس المجلد
        run: |
          mkdir -p "$RUNNER_TEMP/w"
          cd "$RUNNER_TEMP/w"
          S="$GITHUB_WORKSPACE/plugins/kmk-plugin/scripts/setup-project.sh"
          bash "$S" twice root root
          bash "$S" twice root root
          cd twice
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::التشغيل الثاني غيّر ملفات"
            git status --short
            exit 1
          fi
          echo "التشغيل الثاني آمن ولم يغيّر شيئًا"
