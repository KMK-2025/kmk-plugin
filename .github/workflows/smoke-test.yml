name: smoke-test

# اختبار دخان: يشغّل سكربت الإنشاء كاملًا على مشروع وهمي مع كل تغيير،
# فتنكشف أخطاء القالب والسكربت قبل النشر — لا عند المتدرب.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: إنشاء مشروع كامل والتحقق من البنية والبوابات
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      npm_config_yes: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, sqlite3, pdo_sqlite
          tools: composer:v2

      - name: تهيئة هوية Git (يحتاجها الالتزام الأول في السكربت)
        run: |
          git config --global user.name "smoke-test"
          git config --global user.email "smoke-test@ci.local"

      - name: تشغيل سكربت الإنشاء كاملًا
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          bash "$GITHUB_WORKSPACE/plugins/kmk-plugin/scripts/setup-project.sh" smoke-proj

      - name: التحقق من البنية (موديولز + نسخ + ملفات الحماية)
        run: |
          cd "$RUNNER_TEMP/work/smoke-proj"
          fail=0
          for p in \
            .claude/hooks/guard.sh \
            .claude/hooks/autosave.sh \
            .claude/settings.json \
            CLAUDE.md \
            docs/api-contract.md \
            backend/phpstan.neon \
            backend/routes/api.php \
            backend/tests/Support/ApiShape.php \
            .claude/scripts/bump-api-version.sh \
            frontend/vitest.config.ts \
            frontend/.prettierrc ; do
            [ -f "$p" ] || { echo "::error::ملف ناقص: $p"; fail=1; }
          done
          for d in \
            backend/app/Modules \
            backend/routes/api/v1 \
            frontend/src/features \
            frontend/src/shared/api \
            frontend/src/shared/components/feedback ; do
            [ -d "$d" ] || { echo "::error::مجلد ناقص: $d"; fail=1; }
          done
          grep -q '"check"' frontend/package.json || { echo "::error::سكربت check ناقص من package.json"; fail=1; }
          # كل أمر: مجلده موجود واسمه في الملف يطابق اسم المجلد
          for s in idea apply-design build-web test share-link deploy fix go-back; do
            f=".claude/skills/$s/SKILL.md"
            [ -f "$f" ] || { echo "::error::أمر ناقص: /$s"; fail=1; continue; }
            grep -q "^name: $s" "$f" || { echo "::error::اسم الأمر لا يطابق مجلده: /$s"; fail=1; }
          done
          # لا مرجع لأمر غير موجود داخل ملفات المشروع
          known='idea|apply-design|build-web|test|share-link|deploy|fix|go-back|start|add-mobile'
          stray=$(grep -rhoE '`/[a-z][a-z-]+[` ]' .claude CLAUDE.md docs | sed -E 's/[` ]$//' | sort -u | grep -vE "^\`/($known)$" || true)
          [ -z "$stray" ] || { echo "::error::مرجع لأمر غير معروف: $stray"; fail=1; }
          # أسماء محجوزة لأوامر Claude Code المدمجة — سكيل بهذا الاسم يُحجب أو يحجب أمرًا أصليًا
          for r in design share undo mobile run verify review init plan debug doctor config status help clear theme; do
            if [ -d ".claude/skills/$r" ]; then echo "::error::اسم أمر محجوز في Claude Code: /$r"; fail=1; fi
          done
          [ "$fail" -eq 0 ] && echo "✔ البنية سليمة"
          exit "$fail"

      - name: اختبار حاجز الأمان (يسمح بالآمن ويمنع الخطر)
        run: |
          cd "$RUNNER_TEMP/work/smoke-proj"
          echo '{"tool_input":{"command":"git status"}}' | bash .claude/hooks/guard.sh \
            || { echo "::error::الحاجز منع أمرًا آمنًا"; exit 1; }
          if echo '{"tool_input":{"command":"git push --force origin main"}}' | bash .claude/hooks/guard.sh; then
            echo "::error::الحاجز لم يمنع الدفع القسري"; exit 1
          fi
          if echo '{"tool_input":{"command":"php artisan migrate:fresh"}}' | bash .claude/hooks/guard.sh; then
            echo "::error::الحاجز لم يمنع الأمر المدمّر لقاعدة البيانات"; exit 1
          fi
          echo "✔ الحاجز يعمل"

      - name: بوابة الواجهة (npm run check)
        run: |
          cd "$RUNNER_TEMP/work/smoke-proj/frontend"
          npm run check

      - name: بوابة الخدمات (pint + larastan + الاختبارات)
        run: |
          cd "$RUNNER_TEMP/work/smoke-proj/backend"
          ./vendor/bin/pint --test
          ./vendor/bin/phpstan analyse --memory-limit=1G
          php artisan test

  mobile:
    name: إضافة تطبيق الجوال والتحقق من بوابته وحارس النسخ
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      npm_config_yes: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, sqlite3, pdo_sqlite
          tools: composer:v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تهيئة هوية Git
        run: |
          git config --global user.name "smoke-test"
          git config --global user.email "smoke-test@ci.local"

      - name: إنشاء المشروع الأساسي
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          bash "$GITHUB_WORKSPACE/plugins/kmk-plugin/scripts/setup-project.sh" smoke-proj

      - name: تجهيز بيئة الجوال بسكربت الإضافة نفسه
        run: |
          bash "$GITHUB_WORKSPACE/plugins/kmk-plugin/scripts/setup-mobile.sh"
          test -f "$HOME/.kmk-mobile-env"
          bash "$GITHUB_WORKSPACE/plugins/kmk-plugin/scripts/doctor-mobile.sh"

      - name: إضافة تطبيق الجوال
        run: |
          source "$HOME/.kmk-mobile-env"
          bash "$GITHUB_WORKSPACE/plugins/kmk-plugin/scripts/add-mobile.sh" "$RUNNER_TEMP/work/smoke-proj" clinic com.kmk

      - name: التحقق من بنية الجوال
        run: |
          cd "$RUNNER_TEMP/work/smoke-proj"
          fail=0
          for p in \
            mobile/pubspec.yaml \
            mobile/analysis_options.yaml \
            mobile/lib/app/router.dart \
            mobile/lib/shared/api/api_config.dart \
            mobile/lib/shared/l10n/app_ar.arb \
            mobile/lib/shared/widgets/feedback/error_state.dart \
            backend/app/Modules/Mobile/Services/AppVersionService.php \
            backend/config/mobile.php \
            backend/routes/api/v1/mobile.php \
            .claude/agents/flutter-builder.md \
            .claude/skills/build-mobile/SKILL.md \
            .github/workflows/mobile-release.yml ; do
            [ -f "$p" ] || { echo "::error::ملف ناقص: $p"; fail=1; }
          done
          grep -q '^name: build-mobile' .claude/skills/build-mobile/SKILL.md || { echo "::error::اسم أمر الجوال لا يطابق مجلده"; fail=1; }
          grep -q 'kmk:mobile' CLAUDE.md || { echo "::error::قسم الجوال ناقص من الدستور"; fail=1; }
          grep -q 'kmk:mobile' docs/api-contract.md || { echo "::error::قسم الجوال ناقص من العقد"; fail=1; }
          grep -q '^  generate: true' mobile/pubspec.yaml || { echo "::error::توليد الترجمة غير مفعّل"; fail=1; }
          grep -q 'android.permission.INTERNET' mobile/android/app/src/main/AndroidManifest.xml || { echo "::error::صلاحية الإنترنت ناقصة"; fail=1; }
          [ ! -e mobile/test/widget_test.dart ] || { echo "::error::اختبار القالب الافتراضي لم يُحذف"; fail=1; }
          known='idea|apply-design|build-web|build-mobile|test|share-link|deploy|fix|go-back|start|add-mobile'
          stray=$(grep -rhoE '`/[a-z][a-z-]+[` ]' .claude CLAUDE.md docs | sed -E 's/[` ]$//' | sort -u | grep -vE "^\`/($known)$" || true)
          [ -z "$stray" ] || { echo "::error::مرجع لأمر غير معروف: $stray"; fail=1; }
          [ "$fail" -eq 0 ] && echo "✔ بنية الجوال سليمة"
          exit "$fail"

      - name: بوابة الجوال (analyze + format + test)
        run: |
          source "$HOME/.kmk-mobile-env"
          cd "$RUNNER_TEMP/work/smoke-proj/mobile"
          flutter analyze
          dart format --set-exit-if-changed lib test
          flutter test

      - name: بوابة الخدمات مع موديول الجوال
        run: |
          cd "$RUNNER_TEMP/work/smoke-proj/backend"
          ./vendor/bin/pint --test
          ./vendor/bin/phpstan analyse --memory-limit=1G
          php artisan test

      - name: حارس التوافق يكشف حذف حقل ويقبل إضافة حقل
        run: |
          cd "$RUNNER_TEMP/work/smoke-proj/backend"
          snapshot=tests/api-snapshots/v1/mobile.app-version.json
          test -f "$snapshot" || { echo "::error::لم يُحفظ شكل الرد"; exit 1; }
          cp "$snapshot" /tmp/snapshot.bak

          # حقل كان موجودًا ولم يعد الرد يحمله = كسر
          php -r '$f=$argv[1]; $s=json_decode(file_get_contents($f), true); $s["data"]["removed_field"]="string"; file_put_contents($f, json_encode($s));' "$snapshot"
          if php artisan test --filter=AppVersionTest > /tmp/guard.txt 2>&1; then
            echo "::error::الحارس لم يكشف حذف الحقل"; exit 1
          fi
          grep -q "removed_field" /tmp/guard.txt || { cat /tmp/guard.txt; echo "::error::رسالة الحارس لا تسمّي الحقل المحذوف"; exit 1; }

          # حقل جديد في الرد = مسموح ويُسجَّل
          php -r '$f=$argv[1]; $s=json_decode(file_get_contents("/tmp/snapshot.bak"), true); unset($s["data"]["latest"]); file_put_contents($f, json_encode($s));' "$snapshot"
          php artisan test --filter=AppVersionTest
          grep -q '"latest"' "$snapshot" || { echo "::error::الحقل الجديد لم يُسجَّل في الشكل"; exit 1; }
          echo "✔ الحارس يعمل"

      - name: الرفع الآلي لنسخة الـ API
        run: |
          source "$HOME/.kmk-mobile-env"
          cd "$RUNNER_TEMP/work/smoke-proj"
          CLAUDE_PROJECT_DIR="$PWD" bash .claude/scripts/bump-api-version.sh "اختبار دخان: تغيير شكل رد"
          test -f backend/routes/api/v2/mobile.php || { echo "::error::لم تُنشأ مسارات v2"; exit 1; }
          grep -q "apiVersion = 'v2'" mobile/lib/shared/api/api_config.dart || { echo "::error::التطبيق لم يُوجَّه إلى v2"; exit 1; }
          grep -q '^| v2 | 1.0.0 |' docs/api-contract.md || { echo "::error::النسخة لم تُسجَّل في العقد"; exit 1; }
          grep -q 'النسخة الأحدث: \*\*v2\*\*' docs/api-contract.md || { echo "::error::لم يُحدَّث رقم النسخة الأحدث"; exit 1; }
          cd backend
          php artisan route:cache
          php artisan route:clear
          php artisan route:list --path=api/v2 --json | grep -qE 'Controllers.{1,2}V1.{1,2}AppVersionController' || { echo "::error::نقاط v2 لا تشير إلى Controllers النسخة السابقة"; exit 1; }
          php artisan test
          cd ../mobile && flutter analyze
          echo "✔ الرفع الآلي يعمل والنسختان تعملان معًا"

      - name: بناء التطبيق لـ Android
        run: |
          source "$HOME/.kmk-mobile-env"
          cd "$RUNNER_TEMP/work/smoke-proj/mobile"
          flutter build apk --debug
          test -f build/app/outputs/flutter-apk/app-debug.apk
